name: Build Windows EXE

on:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag de la release à mettre à jour, exemple: 1.0 ou v1.0.0. Laisse vide pour ne pas publier dans Releases."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

          if (Test-Path "requirements.txt") {
            pip install -r requirements.txt
          }

      - name: Build executable
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\build_exe_interpreter.ps1

      - name: Package release files
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release

          Copy-Item "dist\Anno Island Interpreter.exe" "release\Anno Island Interpreter.exe"

          if (Test-Path "README_FR_ISLAND_INTERPRETER.md") {
            Copy-Item "README_FR_ISLAND_INTERPRETER.md" "release\README_FR_ISLAND_INTERPRETER.md"
          }

          if (Test-Path "README_EN_ISLAND_INTERPRETER.md") {
            Copy-Item "README_EN_ISLAND_INTERPRETER.md" "release\README_EN_ISLAND_INTERPRETER.md"
          }

          if (Test-Path "README_GER_ISLAND_INTERPRETER.md") {
            Copy-Item "README_GER_ISLAND_INTERPRETER.md" "release\README_GER_ISLAND_INTERPRETER.md"
          }

          Compress-Archive -Path release\* -DestinationPath "Anno-Island-Interpreter-Windows.zip" -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: Anno-Island-Interpreter-Windows
          path: Anno-Island-Interpreter-Windows.zip

      - name: Decide release tag
        id: release_tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ github.event.inputs.release_tag }}" ]]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload ZIP to GitHub Release
        if: steps.release_tag.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.release_tag.outputs.tag }}" "Anno-Island-Interpreter-Windows.zip" --clobber
